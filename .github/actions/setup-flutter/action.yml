name: Setup Flutter
description: Flutter from .flutter-version, pub cache and dependencies — shared by all jobs.
runs:
  using: composite
  steps:
    # pubspec.yaml only sets a lower bound, so a newer SDK on a developer's machine still
    # resolves; the version CI builds with is pinned here.
    - name: Read Flutter version
      id: version
      shell: bash
      run: echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ steps.version.outputs.flutter }}
        # Caches the SDK download (~1 min per run).
        cache: true

    - name: Cache pub dependencies
      uses: actions/cache@v6
      with:
        path: ~/.pub-cache
        # No restore-keys: a cache from an older pubspec.lock can contain half-installed
        # packages, and pub does not always repair those cleanly.
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

    - name: Install dependencies
      shell: bash
      run: flutter pub get
